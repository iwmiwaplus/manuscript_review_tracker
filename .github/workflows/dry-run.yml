name: Controller dry run
run-name: 'Controller dry run ${{ inputs.release_tag }} by @${{ github.actor }}'

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to dry-run (e.g. v1.2.0-rc.1)'
        required: true
        type: string

permissions: {}

concurrency:
  group: promote-naga-pilot
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check run
        shell: bash
        env:
          RELEASE_PROMOTER: ${{ vars.RELEASE_PROMOTER }}
        run: bash scripts/check-run.sh

      - name: Check allowlist
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: bash scripts/verify-release.sh releases/naga-pilot.json "$RELEASE_TAG"

      - name: Show release for approval
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          COMMIT=$(jq -r --arg tag "$RELEASE_TAG" '.releases[$tag].commit' releases/naga-pilot.json)
          TREE=$(jq -r --arg tag "$RELEASE_TAG" '.releases[$tag].tree' releases/naga-pilot.json)
          {
            printf 'tag: %s\n' "$RELEASE_TAG"
            printf 'commit: %s\n' "$COMMIT"
            printf 'tree: %s\n' "$TREE"
          } >> "$GITHUB_STEP_SUMMARY"

  dry-run:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: controller-dry-run
    permissions:
      contents: read
    steps:
      - name: Checkout controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Repeated here: "Re-run failed jobs" reuses preflight's earlier result.
      - name: Check run
        shell: bash
        env:
          RELEASE_PROMOTER: ${{ vars.RELEASE_PROMOTER }}
        run: bash scripts/check-run.sh

      - name: Fetch source
        shell: bash
        env:
          SOURCE_DEPLOY_KEY: ${{ secrets.SOURCE_DEPLOY_KEY }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          SOURCE_REPOSITORY="$(jq -r .source_repository releases/naga-pilot.json)" \
            bash scripts/fetch-source.sh releases/naga-pilot.json "$RELEASE_TAG" "$RUNNER_TEMP/src"

      - name: Verify release
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: bash scripts/verify-release.sh releases/naga-pilot.json "$RELEASE_TAG" "$RUNNER_TEMP/src"

      # Same pinned CLI as the promotion; the tarball's `supabase` is a shim
      # that execs the `supabase-go` beside it.
      - name: Install Supabase CLI
        shell: bash
        env:
          SUPABASE_CLI_URL: https://github.com/supabase/cli/releases/download/v2.113.0/supabase_2.113.0_linux_amd64.tar.gz
          SUPABASE_CLI_SHA256: 14659e7148ad17b77e69e5c36b27be572110519c76c796da1b53c07c3590f593
        run: |
          # shellcheck disable=SC2016 # expanded by the inner bash from the step env
          bash "$GITHUB_WORKSPACE/scripts/quiet.sh" supabase-cli bash -euc '
            curl --fail --silent --show-error --location --proto "=https" --retry 3 \
              --output "$RUNNER_TEMP/supabase-cli.tar.gz" "$SUPABASE_CLI_URL"
            printf "%s  %s\n" "$SUPABASE_CLI_SHA256" "$RUNNER_TEMP/supabase-cli.tar.gz" | sha256sum --check --strict
            mkdir -p "$RUNNER_TEMP/bin"
            tar -xzf "$RUNNER_TEMP/supabase-cli.tar.gz" -C "$RUNNER_TEMP/bin" supabase supabase-go
            test -x "$RUNNER_TEMP/bin/supabase"
          '
          bash "$GITHUB_WORKSPACE/scripts/quiet.sh" supabase-version "$RUNNER_TEMP/bin/supabase" --version

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install tools
        shell: bash
        run: |
          bash "$GITHUB_WORKSPACE/scripts/quiet.sh" tools \
            npm ci --ignore-scripts --no-audit --no-fund --prefix "$GITHUB_WORKSPACE/tools"
          bash "$GITHUB_WORKSPACE/scripts/quiet.sh" vercel-version \
            "$GITHUB_WORKSPACE/tools/node_modules/.bin/vercel" --version

      - name: Install
        shell: bash
        working-directory: ${{ runner.temp }}/src
        run: bash "$GITHUB_WORKSPACE/scripts/quiet.sh" install npm ci --ignore-scripts

      - name: Build
        shell: bash
        working-directory: ${{ runner.temp }}/src
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.invalid
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dry-run
          NEXT_PUBLIC_SITE_URL: https://example.invalid
          NEXT_TELEMETRY_DISABLED: '1'
        run: bash "$GITHUB_WORKSPACE/scripts/quiet.sh" build npx next build

      - name: Canary
        shell: bash
        env:
          DRY_RUN_CANARY: ${{ secrets.DRY_RUN_CANARY }}
        run: |
          if [ -n "$DRY_RUN_CANARY" ]; then
            printf 'canary: present\n'
          else
            printf 'canary: absent\n'
          fi

      - name: Record dry run
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          COMMIT=$(jq -r --arg tag "$RELEASE_TAG" '.releases[$tag].commit' releases/naga-pilot.json)
          TREE=$(jq -r --arg tag "$RELEASE_TAG" '.releases[$tag].tree' releases/naga-pilot.json)
          {
            printf 'tag: %s\n' "$RELEASE_TAG"
            printf 'commit: %s\n' "$COMMIT"
            printf 'tree: %s\n' "$TREE"
            printf 'dry run: build ok\n'
          } >> "$GITHUB_STEP_SUMMARY"
