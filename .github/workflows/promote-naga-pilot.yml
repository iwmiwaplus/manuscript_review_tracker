name: Promote Naga pilot
run-name: 'Promote Naga pilot ${{ inputs.release_tag }} by @${{ github.actor }}'

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to promote (e.g. v1.2.0-rc.1)'
        required: true
        type: string

permissions: {}

concurrency:
  group: promote-naga-pilot
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check run
        shell: bash
        env:
          RELEASE_PROMOTER: ${{ vars.RELEASE_PROMOTER }}
        run: bash scripts/check-run.sh

      - name: Check allowlist
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: bash scripts/verify-release.sh releases/naga-pilot.json "$RELEASE_TAG"

      - name: Show release for approval
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          COMMIT=$(jq -r --arg tag "$RELEASE_TAG" '.releases[$tag].commit' releases/naga-pilot.json)
          TREE=$(jq -r --arg tag "$RELEASE_TAG" '.releases[$tag].tree' releases/naga-pilot.json)
          {
            printf 'tag: %s\n' "$RELEASE_TAG"
            printf 'commit: %s\n' "$COMMIT"
            printf 'tree: %s\n' "$TREE"
          } >> "$GITHUB_STEP_SUMMARY"

  promote:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: naga-pilot
    permissions:
      contents: read
    steps:
      - name: Checkout controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Repeated here: "Re-run failed jobs" reuses preflight's earlier result.
      - name: Check run
        shell: bash
        env:
          RELEASE_PROMOTER: ${{ vars.RELEASE_PROMOTER }}
        run: bash scripts/check-run.sh

      - name: Fetch source
        shell: bash
        env:
          SOURCE_DEPLOY_KEY: ${{ secrets.SOURCE_DEPLOY_KEY }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          SOURCE_REPOSITORY="$(jq -r .source_repository releases/naga-pilot.json)" \
            bash scripts/fetch-source.sh releases/naga-pilot.json "$RELEASE_TAG" "$RUNNER_TEMP/src"

      - name: Verify release
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: bash scripts/verify-release.sh releases/naga-pilot.json "$RELEASE_TAG" "$RUNNER_TEMP/src"

      - name: Check deployment configuration
        shell: bash
        env:
          PILOT_SUPABASE_ACCESS_TOKEN: ${{ secrets.PILOT_SUPABASE_ACCESS_TOKEN }}
          PILOT_SUPABASE_DB_PASSWORD: ${{ secrets.PILOT_SUPABASE_DB_PASSWORD }}
          PILOT_SUPABASE_PROJECT_REF: ${{ secrets.PILOT_SUPABASE_PROJECT_REF }}
          PILOT_VERCEL_TOKEN: ${{ secrets.PILOT_VERCEL_TOKEN }}
          PILOT_VERCEL_ORG_ID: ${{ secrets.PILOT_VERCEL_ORG_ID }}
          PILOT_VERCEL_PROJECT_ID: ${{ secrets.PILOT_VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$PILOT_SUPABASE_ACCESS_TOKEN" ] || [ -z "$PILOT_SUPABASE_DB_PASSWORD" ] || \
             [ -z "$PILOT_SUPABASE_PROJECT_REF" ] || [ -z "$PILOT_VERCEL_TOKEN" ] || \
             [ -z "$PILOT_VERCEL_ORG_ID" ] || [ -z "$PILOT_VERCEL_PROJECT_ID" ]; then
            printf 'verify: FAIL deployment-config-missing\n'
            exit 1
          fi

      # Tools come first so nothing tool-related can fail after migrations. The
      # installs are npm ci --ignore-scripts of this repository's own lockfile: no
      # application or install-script code runs and no secret is in these steps' env.
      # deploy-tools is the copy Deploy uses; it is not executed before Deploy.
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install tools
        shell: bash
        run: |
          : > "$RUNNER_TEMP/npmrc-empty"
          bash "$GITHUB_WORKSPACE/scripts/quiet.sh" tools \
            npm ci --ignore-scripts --no-audit --no-fund --userconfig "$RUNNER_TEMP/npmrc-empty" \
            --prefix "$GITHUB_WORKSPACE/tools"
          bash "$GITHUB_WORKSPACE/scripts/quiet.sh" vercel-version \
            "$GITHUB_WORKSPACE/tools/node_modules/.bin/vercel" --version
          rm -rf "$RUNNER_TEMP/deploy-tools" "$RUNNER_TEMP/npm-cache-deploy"
          mkdir "$RUNNER_TEMP/deploy-tools"
          : > "$RUNNER_TEMP/npmrc-empty-deploy"
          cp "$GITHUB_WORKSPACE/tools/package.json" "$GITHUB_WORKSPACE/tools/package-lock.json" "$RUNNER_TEMP/deploy-tools/"
          bash "$GITHUB_WORKSPACE/scripts/quiet.sh" deploy-tools \
            npm ci --ignore-scripts --no-audit --no-fund --cache "$RUNNER_TEMP/npm-cache-deploy" \
            --userconfig "$RUNNER_TEMP/npmrc-empty-deploy" --prefix "$RUNNER_TEMP/deploy-tools"

      # Recorded before any application code runs; a step output is held by the
      # runner, out of reach of the build. Re-checked in "Verify tools".
      - name: Record tool digest
        id: tooldigest
        shell: bash
        run: |
          SCRIPT=$(sha256sum < "$GITHUB_WORKSPACE/scripts/tool-digest.sh") || SCRIPT=
          SCRIPT=${SCRIPT%% *}
          NODE_DIR=$(dirname "$(dirname "$(readlink -f "$(command -v node)")")")
          DIGEST=$(bash "$GITHUB_WORKSPACE/scripts/tool-digest.sh" "$GITHUB_WORKSPACE" "$NODE_DIR" "$RUNNER_TEMP/deploy-tools") || {
            printf 'verify: FAIL tool-integrity\n'
            exit 1
          }
          if ! [[ "$SCRIPT" =~ ^[0-9a-f]{64}$ ]]; then
            printf 'verify: FAIL tool-integrity\n'
            exit 1
          fi
          {
            printf 'digest=%s\n' "$DIGEST"
            printf 'script=%s\n' "$SCRIPT"
          } >> "$GITHUB_OUTPUT"
          printf 'tools: recorded\n'

      # No application code runs until every Supabase step is done: the CLI is
      # a sha256-pinned release binary, and the app is not installed yet.
      # The tarball's `supabase` is a shim that execs the `supabase-go` beside it.
      - name: Install Supabase CLI
        shell: bash
        env:
          SUPABASE_CLI_URL: https://github.com/supabase/cli/releases/download/v2.113.0/supabase_2.113.0_linux_amd64.tar.gz
          SUPABASE_CLI_SHA256: 14659e7148ad17b77e69e5c36b27be572110519c76c796da1b53c07c3590f593
        run: |
          # shellcheck disable=SC2016 # expanded by the inner bash from the step env
          bash "$GITHUB_WORKSPACE/scripts/quiet.sh" supabase-cli bash -euc '
            curl --fail --silent --show-error --location --proto "=https" --retry 3 \
              --output "$RUNNER_TEMP/supabase-cli.tar.gz" "$SUPABASE_CLI_URL"
            printf "%s  %s\n" "$SUPABASE_CLI_SHA256" "$RUNNER_TEMP/supabase-cli.tar.gz" | sha256sum --check --strict
            mkdir -p "$RUNNER_TEMP/bin"
            tar -xzf "$RUNNER_TEMP/supabase-cli.tar.gz" -C "$RUNNER_TEMP/bin" supabase supabase-go
            test -x "$RUNNER_TEMP/bin/supabase"
          '

      - name: Link database
        shell: bash
        working-directory: ${{ runner.temp }}/src
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.PILOT_SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.PILOT_SUPABASE_DB_PASSWORD }}
          PILOT_SUPABASE_PROJECT_REF: ${{ secrets.PILOT_SUPABASE_PROJECT_REF }}
        run: |
          bash "$GITHUB_WORKSPACE/scripts/quiet.sh" db-link \
            "$RUNNER_TEMP/bin/supabase" link --project-ref "$PILOT_SUPABASE_PROJECT_REF"

      - name: Preview migrations
        shell: bash
        working-directory: ${{ runner.temp }}/src
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.PILOT_SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.PILOT_SUPABASE_DB_PASSWORD }}
        run: |
          bash "$GITHUB_WORKSPACE/scripts/quiet.sh" db-preview \
            "$RUNNER_TEMP/bin/supabase" db push --linked --include-all --dry-run

      - name: Apply migrations
        shell: bash
        working-directory: ${{ runner.temp }}/src
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.PILOT_SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.PILOT_SUPABASE_DB_PASSWORD }}
        run: |
          bash "$GITHUB_WORKSPACE/scripts/quiet.sh" db-push \
            "$RUNNER_TEMP/bin/supabase" db push --linked --include-all --yes

      - name: Deploy notification worker
        shell: bash
        working-directory: ${{ runner.temp }}/src
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.PILOT_SUPABASE_ACCESS_TOKEN }}
          PILOT_SUPABASE_PROJECT_REF: ${{ secrets.PILOT_SUPABASE_PROJECT_REF }}
        run: |
          bash "$GITHUB_WORKSPACE/scripts/quiet.sh" edge-deploy \
            "$RUNNER_TEMP/bin/supabase" functions deploy deliver-notifications --project-ref "$PILOT_SUPABASE_PROJECT_REF" --use-api

      - name: Remove database link
        shell: bash
        run: rm -rf "$RUNNER_TEMP/src/supabase/.temp"

      - name: Install
        shell: bash
        working-directory: ${{ runner.temp }}/src
        run: bash "$GITHUB_WORKSPACE/scripts/quiet.sh" install npm ci --ignore-scripts

      - name: Pull Vercel configuration
        shell: bash
        working-directory: ${{ runner.temp }}/src
        env:
          VERCEL_TOKEN: ${{ secrets.PILOT_VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.PILOT_VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.PILOT_VERCEL_PROJECT_ID }}
        run: |
          bash "$GITHUB_WORKSPACE/scripts/quiet.sh" vercel-pull \
            "$GITHUB_WORKSPACE/tools/node_modules/.bin/vercel" pull --yes --environment=production

      - name: Build
        shell: bash
        working-directory: ${{ runner.temp }}/src
        run: |
          STATUS=0
          bash "$GITHUB_WORKSPACE/scripts/quiet.sh" vercel-build \
            "$GITHUB_WORKSPACE/tools/node_modules/.bin/vercel" build --prod || STATUS=$?
          # Nothing the build wrote to the step files reaches later steps.
          : > "$GITHUB_ENV"
          : > "$GITHUB_PATH"
          : > "$GITHUB_OUTPUT"
          : > "$GITHUB_STEP_SUMMARY"
          exit "$STATUS"

      # The build ran application code as this user: re-check the tools (local
      # only, no network) before Deploy uses the pre-installed deploy-tools copy.
      - name: Verify tools
        shell: bash
        env:
          RECORDED_DIGEST: ${{ steps.tooldigest.outputs.digest }}
          RECORDED_SCRIPT: ${{ steps.tooldigest.outputs.script }}
        run: |
          fail() {
            printf 'verify: FAIL tool-integrity\n'
            exit 1
          }
          for v in BASH_ENV ENV LD_PRELOAD LD_LIBRARY_PATH NODE_OPTIONS; do
            [ -z "${!v:-}" ] || fail
          done
          # Check the digest script itself (system sha256sum) before running it.
          SCRIPT=$(sha256sum < "$GITHUB_WORKSPACE/scripts/tool-digest.sh") || fail
          SCRIPT=${SCRIPT%% *}
          if [ -z "$RECORDED_SCRIPT" ] || [ "$SCRIPT" != "$RECORDED_SCRIPT" ]; then
            fail
          fi
          NODE_DIR=$(dirname "$(dirname "$(readlink -f "$(command -v node)")")")
          DIGEST=$(bash "$GITHUB_WORKSPACE/scripts/tool-digest.sh" "$GITHUB_WORKSPACE" "$NODE_DIR" "$RUNNER_TEMP/deploy-tools") || fail
          if [ -z "$RECORDED_DIGEST" ] || [ -z "$DIGEST" ] || [ "$DIGEST" != "$RECORDED_DIGEST" ]; then
            fail
          fi
          rm -rf "$RUNNER_TEMP/vercel-global"
          mkdir "$RUNNER_TEMP/vercel-global"
          printf 'tools: verified\n'

      - name: Deploy
        id: deploy
        shell: bash
        working-directory: ${{ runner.temp }}/src
        env:
          VERCEL_TOKEN: ${{ secrets.PILOT_VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.PILOT_VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.PILOT_VERCEL_PROJECT_ID }}
        # --format json: stdout alone is one JSON object, kept apart from the stage
        # log (stderr). The human-format URL on stdout has no trailing newline, so
        # a merged stdout+stderr log glues it to the next progress line.
        run: |
          JSON_FILE="$RUNNER_TEMP/controller-logs/vercel-deploy.json"
          # shellcheck disable=SC2016 # expanded by the inner bash
          bash "$GITHUB_WORKSPACE/scripts/quiet.sh" vercel-deploy \
            bash -c 'umask 077; out=$1; shift; "$@" > "$out"' _ "$JSON_FILE" \
            "$RUNNER_TEMP/deploy-tools/node_modules/.bin/vercel" deploy --prebuilt --prod --format json \
            --global-config "$RUNNER_TEMP/vercel-global"
          if ! IDENTITY=$(bash "$GITHUB_WORKSPACE/scripts/deploy-identity.sh" "$JSON_FILE"); then
            printf '%s\n' "$IDENTITY"
            exit 1
          fi
          printf '%s\n' "$IDENTITY" >> "$GITHUB_OUTPUT"
          printf 'deploy: identified\n'

      - name: Verify public routes
        shell: bash
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: |
          for path in /login /register; do
            CODE=$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 20 "$DEPLOY_URL$path" || true)
            CODE=${CODE:-000}
            if [ "$CODE" != "200" ]; then
              printf 'routes: FAIL %s %s\n' "$path" "$CODE"
              exit 1
            fi
          done
          printf 'routes: ok\n'

      - name: Record promotion
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          DEPLOYMENT_ID: ${{ steps.deploy.outputs.deployment_id }}
        run: |
          COMMIT=$(jq -r --arg tag "$RELEASE_TAG" '.releases[$tag].commit' releases/naga-pilot.json)
          TREE=$(jq -r --arg tag "$RELEASE_TAG" '.releases[$tag].tree' releases/naga-pilot.json)
          {
            printf 'tag: %s\n' "$RELEASE_TAG"
            printf 'commit: %s\n' "$COMMIT"
            printf 'tree: %s\n' "$TREE"
            printf 'deployment: %s\n' "$DEPLOYMENT_ID"
          } >> "$GITHUB_STEP_SUMMARY"
